[project]
name = "sharpwire"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.16.8",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Integration tests talk to live services, so a plain `pytest` never runs them, even with NETBOX_URL set.
addopts = ["-m", "not integration"]
markers = [
    "integration: requires live services: NetBox, and the containerlab or nested Proxmox lab (run with: pytest -m integration tests/integration/)",
]

[tool.ruff]
target-version = "py314"
line-length = 120
# Spikes are throwaway lab scripts, not product code. Django migrations are generated.
extend-exclude = ["spikes", "netbox-plugin/sharpwire_netbox/migrations"]

[tool.ruff.per-file-target-version]
# The node helper runs on the python3 Proxmox VE 9 ships (Debian 13), not the controller's.
"node/*" = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "B008", # function calls in default args (FastAPI Depends(...) relies on this)
]

[tool.ruff.lint.per-file-ignores]
# Django and NetBox declare views, forms, serializers and test cases with mutable class attributes.
"netbox-plugin/*" = ["RUF012"]
# strawberry resolves these annotations at runtime, and the names are imported only under TYPE_CHECKING.
"netbox-plugin/sharpwire_netbox/graphql/*" = ["UP037"]
"tests/*" = [
    "E501",    # test payloads/assertions can be long; not worth wrapping
    "RUF059",  # fixtures often return tuples where a test only needs some elements
]

[tool.mypy]
python_version = "3.14"
files = ["app", "node", "tests"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
