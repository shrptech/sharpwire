! FRR instance "leaf" running in netns leaf: emulates core A on VLAN 101
frr defaults datacenter
hostname coreA
service integrated-vtysh-config
!
ipv6 route 2001:db8:ffff::12/128 blackhole
!
router bgp 4200000001
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 neighbor 2001:db8:101::11 remote-as 4200000011
 neighbor 2001:db8:101::11 bfd
 address-family ipv6 unicast
  network 2001:db8:ffff::12/128
  neighbor 2001:db8:101::11 activate
 exit-address-family
exit
!
bfd
exit
