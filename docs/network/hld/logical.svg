<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="900" height="560" fill="#fff"/>
  <!-- buses -->
  <line x1="40" y1="150" x2="860" y2="150" stroke="#2c5aa0" stroke-width="4"/>
  <line x1="40" y1="180" x2="860" y2="180" stroke="#2e7d32" stroke-width="4"/>
  <line x1="40" y1="210" x2="860" y2="210" stroke="#d35400" stroke-width="4"/>

  <!-- cores -->
  <rect x="150" y="20" width="220" height="80" rx="6" fill="#e8f0fb" stroke="#2c5aa0" stroke-width="1.5"/>
  <text x="260" y="42" text-anchor="middle" font-weight="bold">Core A · AS 4200000001</text>
  <text x="260" y="60" text-anchor="middle" font-size="11">vlan101 ::1 · vlan300 .1 / ::1</text>
  <text x="260" y="76" text-anchor="middle" font-size="11">eBGP per node, nexthop propagate</text>
  <text x="260" y="92" text-anchor="middle" font-size="11">pub4/pub6 listeners, default-originate</text>
  <rect x="530" y="20" width="220" height="80" rx="6" fill="#e8f0fb" stroke="#2c5aa0" stroke-width="1.5"/>
  <text x="640" y="42" text-anchor="middle" font-weight="bold">Core B · AS 4200000002</text>
  <text x="640" y="60" text-anchor="middle" font-size="11">vlan102 ::1 · vlan300 .2 / ::2</text>
  <text x="640" y="76" text-anchor="middle" font-size="11">eBGP per node, nexthop propagate</text>
  <text x="640" y="92" text-anchor="middle" font-size="11">pub4/pub6 listeners, default-originate</text>
  <g stroke-width="2.5">
    <line x1="210" y1="100" x2="210" y2="150" stroke="#2c5aa0"/>
    <line x1="320" y1="100" x2="320" y2="210" stroke="#d35400"/>
    <line x1="590" y1="100" x2="590" y2="180" stroke="#2e7d32"/>
    <line x1="700" y1="100" x2="700" y2="210" stroke="#d35400"/>
  </g>
  <g fill="#000"><circle cx="210" cy="150" r="4"/><circle cx="320" cy="210" r="4"/><circle cx="590" cy="180" r="4"/><circle cx="700" cy="210" r="4"/></g>

  <!-- nodes -->
  <g id="nodes">
    <rect x="40" y="260" width="250" height="160" rx="6" fill="#fdf3e3" stroke="#b26a00" stroke-width="1.5"/>
    <rect x="320" y="260" width="250" height="160" rx="6" fill="#fdf3e3" stroke="#b26a00" stroke-width="1.5"/>
    <rect x="600" y="260" width="250" height="160" rx="6" fill="#fdf3e3" stroke="#b26a00" stroke-width="1.5"/>
  </g>
  <g stroke-width="2.5">
    <line x1="70" y1="150" x2="70" y2="260" stroke="#2c5aa0"/><line x1="95" y1="180" x2="95" y2="260" stroke="#2e7d32"/><line x1="260" y1="210" x2="260" y2="260" stroke="#d35400"/>
    <line x1="350" y1="150" x2="350" y2="260" stroke="#2c5aa0"/><line x1="375" y1="180" x2="375" y2="260" stroke="#2e7d32"/><line x1="540" y1="210" x2="540" y2="260" stroke="#d35400"/>
    <line x1="630" y1="150" x2="630" y2="260" stroke="#2c5aa0"/><line x1="655" y1="180" x2="655" y2="260" stroke="#2e7d32"/><line x1="820" y1="210" x2="820" y2="260" stroke="#d35400"/>
  </g>
  <g font-size="11">
    <text x="165" y="280" text-anchor="middle" font-weight="bold" font-size="13">pve1</text>
    <rect x="50" y="288" width="230" height="60" fill="#fff" stroke="#999"/>
    <text x="58" y="304">default VRF · FRR AS 65000</text>
    <text x="58" y="319">dummy0 VTEP 2001:db8:ffff::11/128</text>
    <text x="58" y="334">underlay eBGP as 4200000011 (local-as)</text>
    <rect x="50" y="354" width="230" height="58" fill="#fff" stroke="#d35400"/>
    <text x="58" y="370">vrf_public · L3VNI 20000</text>
    <text x="58" y="385">bond0.300 · eBGP as 4200000100</text>
    <text x="58" y="400">anycast gateway on every VNet</text>

    <text x="445" y="280" text-anchor="middle" font-weight="bold" font-size="13">pve2</text>
    <rect x="330" y="288" width="230" height="60" fill="#fff" stroke="#999"/>
    <text x="338" y="304">default VRF · FRR AS 65000</text>
    <text x="338" y="319">dummy0 VTEP 2001:db8:ffff::12/128</text>
    <text x="338" y="334">underlay eBGP as 4200000012 (local-as)</text>
    <rect x="330" y="354" width="230" height="58" fill="#fff" stroke="#d35400"/>
    <text x="338" y="370">vrf_public · L3VNI 20000</text>
    <text x="338" y="385">bond0.300 · eBGP as 4200000100</text>
    <text x="338" y="400">anycast gateway on every VNet</text>

    <text x="725" y="280" text-anchor="middle" font-weight="bold" font-size="13">pve3 …</text>
    <rect x="610" y="288" width="230" height="60" fill="#fff" stroke="#999"/>
    <text x="618" y="304">default VRF · FRR AS 65000</text>
    <text x="618" y="319">dummy0 VTEP 2001:db8:ffff::13/128</text>
    <text x="618" y="334">underlay eBGP as 4200000013 (local-as)</text>
    <rect x="610" y="354" width="230" height="58" fill="#fff" stroke="#d35400"/>
    <text x="618" y="370">vrf_public · L3VNI 20000</text>
    <text x="618" y="385">bond0.300 · eBGP as 4200000100</text>
    <text x="618" y="400">anycast gateway on every VNet</text>
  </g>

  <!-- overlay -->
  <g fill="none" stroke="#7b1fa2" stroke-width="2" stroke-dasharray="7 5">
    <path d="M165 420 Q305 470 445 420"/>
    <path d="M445 420 Q585 470 725 420"/>
    <path d="M165 420 Q445 530 725 420"/>
  </g>
  <text x="450" y="500" text-anchor="middle" font-size="12" fill="#7b1fa2">Overlay: iBGP EVPN, AS 65000, full mesh between VTEP loopbacks · VXLAN over IPv6</text>
  <text x="450" y="530" text-anchor="middle" font-size="11" fill="#555">Underlay: each node learns the other loopbacks from both cores, with the originating node's own VLAN address as next hop,</text>
  <text x="450" y="546" text-anchor="middle" font-size="11" fill="#555">so node-to-node VXLAN goes straight across the leafs (ECMP over VLAN 101 and 102) and never through a core.</text>
  <text x="44" y="144" font-size="11" fill="#2c5aa0" stroke="#fff" stroke-width="4" paint-order="stroke">VLAN 101 underlay A · 2001:db8:101::/64</text>
  <text x="44" y="174" font-size="11" fill="#2e7d32" stroke="#fff" stroke-width="4" paint-order="stroke">VLAN 102 underlay B · 2001:db8:102::/64</text>
  <text x="44" y="204" font-size="11" fill="#d35400" stroke="#fff" stroke-width="4" paint-order="stroke">VLAN 300 public handoff · 10.250.0.0/24 + 2001:db8:250::/64</text>
</svg>
