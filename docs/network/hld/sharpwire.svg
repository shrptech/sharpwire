<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#444"/></marker></defs>
  <rect width="900" height="470" fill="#fff"/>
  <g stroke="#444" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <line x1="160" y1="65" x2="218" y2="88"/>
    <line x1="160" y1="135" x2="218" y2="115"/>
    <line x1="400" y1="100" x2="458" y2="100"/>
    <line x1="545" y1="300" x2="545" y2="378"/>
    <line x1="670" y1="300" x2="670" y2="378"/>
    <line x1="815" y1="300" x2="815" y2="378"/>
    <line x1="400" y1="345" x2="470" y2="302"/>
    <line x1="520" y1="110" x2="520" y2="110"/>
  </g>
  <g stroke="#444" stroke-width="1.6" fill="none">
    <line x1="400" y1="255" x2="460" y2="255"/>
