  <text x="430" y="92" text-anchor="middle" font-size="10" fill="#555">GraphQL,</text>
  <text x="430" y="120" text-anchor="middle" font-size="10" fill="#555">event rules</text>

  <rect x="20" y="40" width="140" height="50" rx="6" fill="#f4f4f4" stroke="#888"/>
  <text x="90" y="62" text-anchor="middle" font-weight="bold">Admin</text>
  <text x="90" y="79" text-anchor="middle" font-size="11">edits intent</text>
  <rect x="20" y="110" width="140" height="50" rx="6" fill="#f4f4f4" stroke="#888"/>
  <text x="90" y="132" text-anchor="middle" font-weight="bold">sharpstack</text>
  <text x="90" y="149" text-anchor="middle" font-size="11">VMs; uses active VNets</text>

  <rect x="220" y="60" width="180" height="85" rx="6" fill="#eaf6ec" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="310" y="85" text-anchor="middle" font-weight="bold">NetBox 4.7</text>
  <text x="310" y="103" text-anchor="middle" font-size="11">+ sharpwire plugin</text>
  <text x="310" y="121" text-anchor="middle" font-size="11">(Zone, VNet, custom fields)</text>
  <text x="310" y="137" text-anchor="middle" font-size="11" font-style="italic">the full intended state</text>

  <rect x="220" y="220" width="180" height="70" rx="6" fill="#e8f0fb" stroke="#2c5aa0" stroke-width="1.5"/>
  <text x="310" y="245" text-anchor="middle" font-weight="bold">Postgres</text>
  <text x="310" y="263" text-anchor="middle" font-size="11">plans, runs, alerts,</text>
  <text x="310" y="279" text-anchor="middle" font-size="11">audit log, job queue</text>

  <rect x="220" y="320" width="180" height="50" rx="6" fill="#f4f4f4" stroke="#888"/>
  <text x="310" y="342" text-anchor="middle" font-weight="bold">Operator</text>
  <text x="310" y="359" text-anchor="middle" font-size="11">web UI · Kanidm OIDC</text>

  <rect x="460" y="20" width="420" height="280" rx="8" fill="#fbfbfb" stroke="#333" stroke-width="1.5"/>
  <text x="670" y="42" text-anchor="middle" font-weight="bold" font-size="14">sharpwire controller (FastAPI)</text>
  <g fill="#fff" stroke="#666">
    <rect x="475" y="60" width="90" height="50" rx="4"/><rect x="575" y="60" width="90" height="50" rx="4"/>
    <rect x="675" y="60" width="90" height="50" rx="4"/><rect x="775" y="60" width="90" height="50" rx="4"/>
    <rect x="475" y="140" width="125" height="50" rx="4"/><rect x="612" y="140" width="130" height="50" rx="4"/>
    <rect x="755" y="140" width="110" height="50" rx="4"/>
    <rect x="475" y="225" width="190" height="50" rx="4"/><rect x="680" y="225" width="185" height="50" rx="4"/>
  </g>
  <g font-size="11" text-anchor="middle">
    <text x="520" y="82">Build intent</text><text x="520" y="97" fill="#555">from NetBox</text>
    <text x="620" y="82">Validate</text><text x="620" y="97" fill="#555">cross-target</text>
    <text x="720" y="82">Render</text><text x="720" y="97" fill="#555">per driver</text>
    <text x="820" y="82">Diff → Plan</text><text x="820" y="97" fill="#555">vs live state</text>
    <text x="537" y="162">Approve</text><text x="537" y="177" fill="#555">a person, every plan</text>
    <text x="677" y="162">Apply</text><text x="677" y="177" fill="#555">rollback armed first</text>
    <text x="810" y="162">Health checks</text><text x="810" y="177" fill="#555">then disarm</text>
    <text x="570" y="247">Drift detection</text><text x="570" y="262" fill="#555">same pipeline, every 5 min</text>
    <text x="772" y="247">Alerts and audit</text><text x="772" y="262" fill="#555">in Postgres, shown in the UI</text>
  </g>
  <g stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#a)">
    <line x1="565" y1="85" x2="573" y2="85"/><line x1="665" y1="85" x2="673" y2="85"/><line x1="765" y1="85" x2="773" y2="85"/>
    <path d="M820 110 L820 125 L537 125 L537 138"/>
    <line x1="600" y1="165" x2="610" y2="165"/><line x1="742" y1="165" x2="753" y2="165"/>
  </g>

  <g fill="#fdf3e3" stroke="#b26a00" stroke-width="1.5">
    <rect x="460" y="380" width="135" height="70" rx="6"/>
    <rect x="605" y="380" width="135" height="70" rx="6"/>
    <rect x="750" y="380" width="130" height="70" rx="6"/>
  </g>
  <g font-size="11" text-anchor="middle">
    <text x="527" y="400" font-weight="bold" font-size="12">RouterOS REST</text>
    <text x="527" y="417">cores (apply)</text><text x="527" y="432">leafs (read-only in v1)</text>
    <text x="672" y="400" font-weight="bold" font-size="12">PVE API</text>
    <text x="672" y="417">cluster SDN (apply)</text><text x="672" y="432">cluster files (read-only)</text>
    <text x="815" y="400" font-weight="bold" font-size="12">SSH + helper</text>
    <text x="815" y="417">sharpwire-node</text><text x="815" y="432">node files (apply)</text>
  </g>
