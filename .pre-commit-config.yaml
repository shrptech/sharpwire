repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: detect-private-key
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
        # Also hand Markdown to ruff, so Python fences in docs are checked like CI's bare `ruff check .` does.
        types_or: [python, pyi, jupyter, markdown]
      - id: ruff-format
        types_or: [python, pyi, jupyter, markdown]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

      # Only a syntax check: the node helper and bootstrap scripts run on a Proxmox node, which no test has.
      - id: shell-syntax
        name: shell syntax (bash -n)
        entry: bash -c 'for f in "$@"; do bash -n "$f" || exit 1; done' --
        language: system
        types: [shell]
